name: Kaggle Dataset Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Using exact stable version from your list
          python-version: '3.12.13' 

      - name: Install dependencies
        run: pip install --upgrade kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download and Unzip dataset
        run: |
          mkdir -p data/external
          # This downloads and extracts the 1GB dataset
          kaggle datasets download -d jacksoncrow/stock-market-dataset -p data/external --unzip

      - name: Upload Dataset as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-market-data
          path: data/external/
          retention-days: 7
