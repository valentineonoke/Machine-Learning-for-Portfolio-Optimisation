name: Kaggle Dataset Download

on:
  workflow_dispatch:

# 1. Added permissions so the script can actually push the data to your repo
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated to v4 to fix the warning

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated to v5 to fix the warning
        with:
          # IMPORTANT: Use quotes around the version number! 
          # Without quotes, '3.12' becomes '3.1', which causes your error.
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download dataset
        run: |
          mkdir -p data/external
          kaggle datasets download -d jacksoncrow/stock-market-dataset -p data/external

      - name: Extract dataset
        run: |
          unzip -o data/external/stock-market-dataset.zip -d data/external

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/external
          # If there are no new changes, this command won't fail the workflow
          git commit -m "Update Kaggle dataset" || exit 0
          git push
