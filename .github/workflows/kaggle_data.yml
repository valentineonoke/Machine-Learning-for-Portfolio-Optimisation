name: Kaggle Dataset Download

on:
  workflow_dispatch:

# Added permissions block to allow the runner to push data to your repository
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated to v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          # IMPORTANT: Use quotes around the version number!
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download dataset
        run: |
          mkdir -p data/external
          kaggle datasets download -d jacksoncrow/stock-market-dataset -p data/external

      - name: Extract dataset
        run: |
          unzip -o data/external/stock-market-dataset.zip -d data/external

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/external
          # If there are no changes, || exit 0 prevents the workflow from failing
          git commit -m "Update Kaggle dataset" || exit 0
          git push
