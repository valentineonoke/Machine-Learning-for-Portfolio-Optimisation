name: Kaggle Dataset Download

on:
  workflow_dispatch:

# Essential: Grant write permissions so the runner can push changes back to your repo
permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Use v4 (latest stable)

      - name: Setup Python
        uses: actions/setup-python@v5 # v5 is correct here
        with:
          # IMPORTANT: Always wrap the version in quotes (e.g., '3.12') 
          # to prevent YAML from turning 3.10 into 3.1
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download dataset
        run: |
          mkdir -p data/external
          kaggle datasets download -d jacksoncrow/stock-market-dataset -p data/external

      - name: Extract dataset
        run: |
          unzip -o data/external/stock-market-dataset.zip -d data/external

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/external
          # If there are no changes, this won't crash the workflow
          git commit -m "Add Kaggle dataset" || exit 0
          git push
