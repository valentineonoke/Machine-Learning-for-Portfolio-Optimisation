name: Kaggle Dataset Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download dataset
        run: |
          kaggle datasets download -d jacksoncrow/stock-market-dataset -p data/external

      - name: Extract dataset
        run: |
          unzip -o data/external/stock-market-dataset.zip -d data/external

      - name: Commit data (optional)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/external
          git commit -m "Add Kaggle dataset" || echo "No changes"
          git push
